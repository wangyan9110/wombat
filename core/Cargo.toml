[package]
name = "wombat-core"
version = "0.3.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
chrono = "0.4"
chrono-tz = "0.10"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value", "float_roundtrip"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
memmap2 = "0.9"
memchr = "2"
schemars = "=1.2.2"
rust_decimal = { version = "=1.40.0", default-features = false, features = ["std"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "cache"] }
notify = "=8.2.0"

[profile.release]
lto = "thin"
strip = true
