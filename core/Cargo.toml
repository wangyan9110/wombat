[package]
name = "wombat-core"
version = "0.1.0-dev.1"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
chrono = "0.4"
chrono-tz = "0.10"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value", "float_roundtrip"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
memmap2 = "0.9"
memchr = "2"
schemars = "=1.2.2"
rust_decimal = { version = "=1.40.0", default-features = false, features = ["std"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "cache"] }
notify = "=8.2.0"
toml_edit = { version = "=0.25.15", default-features = false, features = ["parse"] }
tiktoken-rs = "=0.12.0"
serde-saphyr = { version = "=1.3.0", default-features = false, features = ["deserialize"] }
pulldown-cmark = { version = "=0.13.4", default-features = false }
unicode-normalization = "=0.1.25"
percent-encoding = "=2.3.2"
shlex = "=2.0.1"

[profile.release]
lto = "thin"
strip = true

[target."cfg(windows)".dependencies]
interprocess = "=2.4.4"
widestring = "=1.2.1"
windows-sys = { version = "=0.61.2", features = ["Win32_System_Pipes", "Win32_Foundation"] }
